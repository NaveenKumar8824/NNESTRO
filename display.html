<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System (KDS) — NESTRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/kitchen.css">
</head>
<body class="kds-body">
    <header class="kds-header">
        <div>
            <h1 style="font-size: 24px; font-weight: 700;">NESTRO Kitchen Display System</h1>
            <p style="color: #94a3b8; font-size: 14px;">Real-time KOT tickets synced with Firestore.</p>
        </div>
        <div style="display: flex; gap: 12px;">
            <span style="background: #1e293b; padding: 8px 16px; border-radius: 8px; border: 1px solid #334155; font-weight: 600;">Active Orders: 3</span>
            <a href="../index.html" style="background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; font-weight: 600; text-decoration: none;">Exit KDS</a>
        </div>
    </header>

    <div class="kds-grid">
        <div class="kds-card">
            <div class="kds-card-header">
                <span class="kds-table-tag">Table 05</span>
                <span style="color: #38bdf8; font-weight: 600; font-size: 14px;">#ORD-1092 • 2m ago</span>
            </div>
            <div>
                <div style="font-size: 15px; font-weight: 600; margin-bottom: 8px;">Items:</div>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #cbd5e1;">
                    <li>1x Grilled Chicken Breast <span style="color: #f97316; font-size: 12px;">(Medium Cook)</span></li>
                    <li>1x Hyderabadi Dum Biryani</li>
                </ul>
            </div>
            <button style="background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;" onclick="alert('Marked as Ready!')">
                Mark as Ready
            </button>
        </div>
    </div>
</body>
</html>
