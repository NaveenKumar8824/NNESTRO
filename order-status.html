<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status — NESTRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/customer.css">
</head>
<body class="customer-body">
    <div class="mobile-frame" style="text-align: center; justify-content: center; padding: 32px;">
        <div style="background: #dcfce7; color: #15803d; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 20px;">
            ✓
        </div>
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">Order Successfully Placed!</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Your KOT has been sent directly to the NESTRO Kitchen. Table 05 session active.</p>
        
        <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 24px; text-align: left;">
            <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px;">
                <span style="color: var(--text-muted);">Order ID:</span>
                <span style="font-weight: 700;">#ORD-1092</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px;">
                <span style="color: var(--text-muted);">Status:</span>
                <span style="color: #0369a1; font-weight: 700;">Preparing (KOT Sent)</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 14px;">
                <span style="color: var(--text-muted);">Est. Time:</span>
                <span style="font-weight: 700;">15–20 mins</span>
            </div>
        </div>

        <a href="menu.html" class="btn-add-cart" style="display: block; padding: 14px; text-align: center; text-decoration: none; border-radius: 12px;">
            Order More Items
        </a>
    </div>
</body>
</html>
